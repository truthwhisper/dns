name: Deploy
on:
  push:
    branches:
       - master
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
env:
   REGISTRY: ghcr.io
   IMAGE_NAME: ${{ github.repository }}
jobs:
   deploy:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: docker/login-action@v4
          with:
             registry: ghcr.io
             username: ${{ github.actor }}
             password: ${{ secrets.GITHUB_TOKEN }}
        - name: Setup QEMU
          uses: docker/setup-qemu-action@v4
        - name: Setup Buildx
          uses: docker/setup-buildx-action@v4
        - name: Build and Push
          uses:
          with:
             context: .
             push: true
             file: Dockerfile
             tags: ghcr.io/${{ github.repository }}:latest
             cache-from: type=gha
             cache-to: type=gha,mode=max
             sbom: true
             provenance: true

           
